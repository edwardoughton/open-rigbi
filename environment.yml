name: rigbi-env
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python and the compiled geospatial stack are installed together from one
  # channel to avoid NumPy/GDAL binary incompatibilities.
  - python=3.12
  - numpy=2.2
  - pandas=2.2
  - geopandas=1.0
  - shapely=2.0
  - pyogrio=0.10
  - pyproj=3.7
  - rasterio=1.4
  - rasterstats=0.20
  - matplotlib=3.9
  - seaborn=0.13
  - pillow=11
  - lxml=5
  - requests=2.32
  - tqdm=4.67

  # R dependencies used by the publication and supplementary figures.
  - r-base=4.4
  - r-tidyverse=2.0
  - r-ggpubr=0.6
  - r-svglite=2.1
  - r-ragg=1.3
